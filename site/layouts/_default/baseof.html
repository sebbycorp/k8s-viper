<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Site.Params.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}" />
</head>
<body class="{{ if .IsHome }}page-home{{ else if eq .Section "agents" }}page-agents{{ else if eq .Section "handbook" }}page-handbook{{ end }}">
  <button type="button" class="toc-toggle" id="toc-toggle" aria-expanded="false">Contents</button>
  <div class="shell">
    {{ partial "toc.html" . }}
    <main>
      {{ block "main" . }}{{ end }}
      <footer class="site-footer">
        <span>k8s-viper · public lab site</span>
        <a href="#top">Back to top</a>
      </footer>
    </main>
  </div>
  {{ $js := resources.Get "js/app.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
