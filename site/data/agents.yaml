    slug: hello-substrate
    job: Kubernetes helper for this dockerized k3s lab.
    isolation: gVisor SandboxAgent
    namespace: kagent
    runtime: Go Declarative
    vault: ""
    image: ""
    gif: ""
    image_caption: ""
    gif_caption: ""
    facts:
      - key: Job
        value: Cluster questions, manifests, troubleshooting
      - key: Tools
        value: kagent-tool-server (k8s_get_*)
      - key: WorkerPool
        value: kagent-default
      - key: Git
        value: platform/kagent-ai/hello-substrate.yaml
    live: []
    gaps:
      - kind: warn
        text: No live screenshot in this repo. I am not inventing or generating one.
      - kind: warn
        text: Nested gVisor on dockerized k3s can fail (runsc / seccomp). Worker CrashLoop is day-2 — do not bump pins to “fix” it.
    links:
      - label: Manifest
        url: https://github.com/sebbycorp/k8s-viper/blob/main/platform/kagent-ai/hello-substrate.yaml
      - label: Runbook
        url: https://github.com/sebbycorp/k8s-viper/blob/main/docs/kagent-substrate.md

