    value: 0.10.0-rc2
  - name: Agent Substrate
    value: "0.0.9"
  - name: WorkerPool
    value: kagent-default
  - name: kagent UI
    value: ":30500"
  - name: model
    value: gpt-5.5 via agentgateway :30100

ui:
