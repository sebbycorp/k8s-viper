    notes: "dummy kagent-openai · hello-substrate · UI :30500"

namespaces:
  - ns: argocd
    purpose: Argo CD control plane + root app-of-apps
  - ns: vault
    purpose: HashiCorp Vault server (Raft single voter)
  - ns: external-secrets
    purpose: External Secrets Operator
  - ns: headlamp
    purpose: Kubernetes dashboard UI
  - ns: agentgateway-system
    purpose: agentgateway control plane + OpenAI/Spark/desktop proxy + OTEL collector
  - ns: desktop
    purpose: computer-use desktop Deployment (noVNC + HTTP API)
  - ns: langfuse
    purpose: Langfuse + Postgres/Redis/ClickHouse/MinIO
  - ns: ate-system
    purpose: Agent Substrate control plane (ate-api, atelet, Valkey, RustFS)
  - ns: kagent
    purpose: OSS kagent controller, UI, WorkerPool, hello-substrate
  - ns: apps
    purpose: Demo / user workloads (whoami)
  - ns: kube-system
    purpose: "k3s system: Traefik, CoreDNS, metrics, local-path"
  - ns: default
    purpose: Kubernetes default (mostly unused by platform)

ingress:
  - host: whoami.viper.local
    target: whoami Service
    ns: apps
    class: traefik
  - host: headlamp.viper.local
    target: headlamp Service
    ns: headlamp
    class: traefik
  - host: langfuse.viper.local
    target: langfuse web
    ns: langfuse
    class: traefik

ports:
  - port: "80 / 443"
    service: Traefik ingress
    how: "LoadBalancer on node IP (k3s ServiceLB). Do not steal for agentgateway — svclb-agentgateway-proxy Pending is cosmetic."
  - port: "30080"
    service: Headlamp
    how: NodePort
  - port: "30443"
    service: Argo CD HTTPS
    how: "NodePort (`argocd-server-nodeport`)"
  - port: "30081"
    service: Argo CD HTTP
    how: NodePort (often redirects)
  - port: "30200"
    service: Vault UI / API
    how: "NodePort (`vault-ui`)"
  - port: "30100"
    service: agentgateway OpenAI + Spark + desktop proxy
    how: "NodePort (`agentgateway-proxy-nodeport`)"
  - port: "30300"
    service: Langfuse UI
    how: "NodePort (langfuse web service)"
  - port: "30500"
    service: kagent UI
    how: "NodePort (`kagent-ui-nodeport`)"
  - port: "6443"
    service: Kubernetes API
    how: k3s on node (kubeconfig)

vault_paths:
  - path: secret/platform/openai
    fields: api_key
    used_by: agentgateway ExternalSecret (kagent uses a dummy Secret; gateway injects this key)
  - path: secret/platform/langfuse
    fields: salt, encryption_key, nextauth_secret, DB passwords
    used_by: Langfuse ExternalSecret
  - path: secret/platform/langfuse-otel
    fields: public_key, secret_key, endpoint
    used_by: OTEL collector → Langfuse (configured; keys in Vault)

bootstrap_env:
  - name: REPO_URL
    default: this GitHub repo
    meaning: GitOps source for Argo
  - name: REPO_REVISION
    default: main
    meaning: Branch / tag / SHA
  - name: ARGOCD_VERSION
    default: v3.5.0
    meaning: Upstream install manifest pin
  - name: INSTALL_K3S_SKIP
    default: "0"
    meaning: "Set `1` if k3s already installed"

