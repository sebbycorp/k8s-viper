    kind: core
    kindLabel: core
    ns: argocd
    source: argocd/project.yaml
    notes: AppProject viper allow-list
  - app: platform-ingress
    kind: ingress
    kindLabel: ingress
    ns: kube-system / apps
    source: platform/ingress/
    notes: Traefik HelmChartConfig + whoami
  - app: platform-vault
    kind: secret
    kindLabel: secrets
    ns: vault
    source: platform/vault/values.yaml
    notes: "Vault Helm · Raft ×1 · UI :30200"
  - app: platform-external-secrets
    kind: secret
    kindLabel: secrets
    ns: external-secrets
    source: platform/external-secrets/
    notes: ESO operator
  - app: platform-headlamp
    kind: ui
    kindLabel: dashboard
    ns: headlamp
    source: platform/headlamp/
    notes: "kustomize helmCharts 0.44.0 · JSON6902 drops hostUsers · :30080"
  - app: platform-argocd-access
    kind: ui
    kindLabel: access
    ns: argocd
    source: platform/argocd-access/
    notes: "Argo UI NodePort :30443 / :30081 · argocd-cm --enable-helm"
  - app: platform-gateway-api
    kind: core
    kindLabel: crds
    ns: cluster
    source: platform/gateway-api/
    notes: Gateway API CRDs v1.6.0
  - app: platform-agentgateway-crds
    kind: core
    kindLabel: crds
    ns: agentgateway-system
    source: oci agentgateway-crds 1.4.1
    notes: agentgateway CRDs
  - app: platform-agentgateway
    kind: ui
    kindLabel: ai
    ns: agentgateway-system
    source: platform/agentgateway/values.yaml
    notes: control plane Helm 1.4.1
  - app: platform-agentgateway-ai
    kind: ui
    kindLabel: ai
    ns: agentgateway-system
    source: platform/agentgateway-ai/
    notes: "one Gateway · OpenAI + Spark + desktop routes · OTEL · :30100"
  - app: platform-desktop
    kind: ui
    kindLabel: desktop
    ns: desktop
    source: platform/desktop/
    notes: "computer-use Deployment · noVNC :6080 · API :18790 · import viper-desktop:dev"
  - app: platform-langfuse-secrets
    kind: secret
    kindLabel: secrets
    ns: langfuse
    source: platform/langfuse/
    notes: ExternalSecret from Vault
  - app: platform-langfuse
    kind: ui
    kindLabel: ai
    ns: langfuse
    source: platform/langfuse/values.yaml
    notes: "Langfuse 1.5.41 + ClickHouse · :30300"
  - app: platform-substrate-crds
    kind: core
    kindLabel: crds
    ns: ate-system
    source: oci substrate-crds 0.0.12
    notes: Agent Substrate CRDs
  - app: platform-substrate
    kind: ui
    kindLabel: ai
    ns: ate-system
    source: platform/substrate/values.yaml
    notes: "Agent Substrate Helm 0.0.12 · JWT · Valkey ×6"
  - app: platform-kagent-crds
    kind: core
    kindLabel: crds
    ns: kagent
    source: oci kagent-crds 0.10.0-rc2
