layout:
  - path: scripts/bootstrap.sh
    role: Only imperative install path (k3s + Argo + root)
  - path: scripts/validate.sh
    role: Local/CI checks — no cluster credentials
  - path: bootstrap/argocd/
    role: Root Application seed
  - path: argocd/project.yaml
    role: AppProject viper
  - path: argocd/apps/
    role: Child Application CRs (GitOps tree)
  - path: platform/ingress/
    role: Traefik config + whoami demo
  - path: platform/vault/
    role: Vault Helm values
  - path: platform/external-secrets/
    role: ESO Helm values + store example
  - path: platform/headlamp/
    role: Headlamp helmCharts + values (JSON6902 drops hostUsers)
  - path: platform/argocd-access/
    role: Argo CD UI NodePort + argocd-cm --enable-helm
  - path: platform/gateway-api/
    role: Gateway API CRDs
  - path: platform/agentgateway/
    role: agentgateway control plane values
  - path: platform/agentgateway-ai/
    role: OpenAI + Spark + desktop Gateway routes, OTEL
  - path: platform/desktop/
    role: computer-use desktop Deployment (noVNC + API)
  - path: images/desktop-computer-use/
    role: viper-desktop:dev image (build on Viper, ctr import)
  - path: platform/langfuse/
    role: Langfuse Helm + ExternalSecret
  - path: platform/substrate/
    role: Agent Substrate Helm values (0.0.12)
  - path: platform/kagent/
    role: kagent OSS Helm values (0.10.0-rc2)
  - path: platform/kagent-ai/
    role: dummy OpenAI Secret + hello SandboxAgent + UI NodePort
  - path: apps/
    role: User workloads
  - path: docs/
    role: Operator runbooks
  - path: site/
    role: Hugo handbook (this site)
  - path: .github/workflows/
    role: CI validate + Pages deploy

out_of_scope:
  - item: ngrok for k8s UIs
    why: ngrok TCP is SSH to the box only; UIs stay on the LAN
  - item: Multi-node / HA control plane
    why: Single-node powerhouse focus
  - item: MetalLB
    why: k3s ServiceLB + node IP is enough
  - item: Push-based deploy from CI
    why: GitOps pull via Argo only
  - item: Cloud KMS auto-unseal
    why: Manual unseal for v1
  - item: kgateway as primary cluster Ingress
    why: Traefik is k3s default; agentgateway is AI data plane only
  - item: Substrate Actor wrap for the computer-use desktop
    why: Follow-up; first path is a Deployment (docs/desktop-computer-use.md). kagent install is OSS + ateom-gvisor only.

troubleshooting:
  - symptom: kubectl not found on the host
    check: "docker exec k3s-viper kubectl …"
  - symptom: Applications stuck Unknown
    check: Repo URL / OCI chart reachable; argocd-repo-server logs
  - symptom: Project errors
    check: appproject viper sourceRepos + destinations
  - symptom: whoami 404
    check: Host header / /etc/hosts; docker exec k3s-viper kubectl -n apps get ingress,pods
  - symptom: Headlamp 404 / no UI
    check: "http://172.16.10.135:30080/; Docker published ports"
  - symptom: Headlamp token rejected
    check: Create a fresh SA token — docs/headlamp.md
  - symptom: platform-headlamp OutOfSync / hostUsers
    check: "JSON6902 removes hostUsers; do not set false. Restart repo-server after --enable-helm"
  - symptom: Argo UI unreachable
    check: svc argocd-server-nodeport; app platform-argocd-access
  - symptom: Vault sealed / UI down
    check: unseal helper; docs/vault-eso-setup.md
  - symptom: ClusterSecretStore not Ready
    check: Vault unsealed + k8s auth role external-secrets
  - symptom: agentgateway GET / → 404
    check: Expected — use /v1, /spark, /desktop/, or /desktop-api/health
  - symptom: desktop ImagePullBackOff
    check: "Import viper-desktop:dev — docs/desktop-computer-use.md"
  - symptom: agentgateway OpenAI 401/404 model
    check: Vault openai key; use gpt-5.5 or gpt-5-mini
  - symptom: Spark 502 / no route
    check: "Backend 172.16.10.173:8000; model Qwen/Qwen3.6-35B-A3B-FP8"
  - symptom: svclb-agentgateway-proxy Pending
    check: Cosmetic — Traefik owns :80/:443. Use NodePort 30100
  - symptom: Langfuse ImagePullBackOff
    check: Cluster egress/DNS to Docker Hub
  - symptom: kagent UI unreachable
    check: "http://172.16.10.135:30500/; Docker published 30500; app platform-kagent-ai"
  - symptom: hello-substrate not Ready
    check: "WorkerPool kagent-default; gVisor-on-dockerized-k3s — docs/kagent-substrate.md"
  - symptom: Re-run bootstrap
    check: "Safe: skips k3s if healthy; re-applies Argo + root app"

