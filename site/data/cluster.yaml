# Environment inventory — rendered by Hugo layouts (edit here, rebuild).

overview:
  - concern: Cluster
    choice: "dockerized k3s (`k3s-viper`, `rancher/k3s:v1.32.5-k3s1`)"
  - concern: Bootstrap
    choice: "`scripts/bootstrap.sh` (once / idempotent)"
  - concern: CD
    choice: "Argo CD app-of-apps (`argocd/apps/*`)"
  - concern: Secrets
    choice: HashiCorp Vault OSS + External Secrets Operator
  - concern: Dashboard
    choice: Headlamp (in-cluster OSS)
  - concern: Ingress
    choice: "Node IP via Traefik (k3s default; not kgateway for cluster edge)"
  - concern: Lab UIs
    choice: "NodePorts 30080 / 30443 / 30200 / **30100** / **30300** / **30500**"
  - concern: AI gateway
    choice: "one Gateway `agentgateway-proxy` :30100 → OpenAI (`/v1`) + DGX Spark (`/spark`) + desktop (`/desktop/`, `/desktop-api/`)"
  - concern: Agents
    choice: "OSS kagent 0.10.0-rc2 + Agent Substrate 0.0.12 (`kagent` + `ate-system`); default model via the same gateway"
  - concern: LLM observability
    choice: "Langfuse + ClickHouse; OTEL path configured (Vault `secret/platform/langfuse-otel`)"
  - concern: Git source
    choice: "github.com/sebbycorp/k8s-viper @ `main`"
  - concern: SSH / tunnel
    choice: "LAN `smaniak@172.16.10.135`; ngrok TCP for SSH only (not k8s UIs)"

