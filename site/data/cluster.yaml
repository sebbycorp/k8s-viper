# Environment inventory — rendered by Hugo layouts (edit here, rebuild).

overview:
  - concern: Cluster
    choice: "k3s, one node (control-plane + worker)"
  - concern: Bootstrap
    choice: "`scripts/bootstrap.sh` (once / idempotent)"
  - concern: CD
    choice: "Argo CD app-of-apps (`argocd/apps/*`)"
  - concern: Secrets
    choice: HashiCorp Vault OSS + External Secrets Operator
  - concern: Dashboard
    choice: Headlamp (in-cluster OSS)
  - concern: Ingress
    choice: "Node IP via Traefik (k3s default; not kgateway for cluster edge)"
  - concern: Lab UIs
    choice: "NodePorts 30080 / 30443 / 30200 / **30100** / **30300**"
  - concern: AI gateway
    choice: "agentgateway 1.4.1 → OpenAI (`gpt-5.5`, `gpt-5-mini`) on `/v1` · Spark Qwen on `/spark`"
  - concern: LLM observability
    choice: "Langfuse + ClickHouse; OTEL from agentgateway"
  - concern: Git source
    choice: "github.com/sebbycorp/k8s-viper @ `main`"
  - concern: Public tunnel
    choice: Not in v1

facts:
  - key: Node name
    value: k3s-viper
  - key: LAN IP (clients)
    value: "172.16.10.135"
  - key: k3s InternalIP
    value: "172.17.0.2 (Docker bridge)"
  - key: k3s / API
    value: v1.32.5+k3s1
  - key: GitOps project
    value: viper
  - key: Ingress class
    value: traefik
  - key: AI models
    value: "gpt-5.5 · gpt-5-mini · Qwen/Qwen3.6-35B-A3B-FP8 (Spark)"
  - key: App of apps
    value: argocd/apps

quick_cards:
  - name: Headlamp
    class: headlamp
    icon: "◉"
    scheme: http
    port: "30080"
  - name: Argo CD
    class: argocd
    icon: "◎"
    scheme: https
    port: "30443"
  - name: Vault UI
    class: vault
    icon: "◇"
    scheme: http
    port: "30200"
  - name: agentgateway
    class: headlamp
    icon: "⚡"
    scheme: http
    port: "30100"
  - name: Langfuse
    class: argocd
    icon: "◈"
    scheme: http
    port: "30300"

uis:
  - name: Headlamp
    type: ui
    typeLabel: NodePort
    scheme: http
    path: ":30080/"
    auth: SA token
    git: platform/headlamp/
  - name: Argo CD
    type: ui
    typeLabel: NodePort
    scheme: https
    path: ":30443/"
    auth: admin + initial secret
    git: platform/argocd-access/
  - name: Vault UI
    type: ui
    typeLabel: NodePort
    scheme: http
    path: ":30200/"
    auth: root / app token after init
    git: platform/vault/values.yaml
  - name: agentgateway
    type: ui
    typeLabel: NodePort
    scheme: http
    path: ":30100/"
    auth: "OpenAI via Vault (no client key)"
    git: platform/agentgateway-ai/
  - name: Langfuse
    type: ui
    typeLabel: NodePort
    scheme: http
    path: ":30300/"
    auth: first-user signup
    git: platform/langfuse/
  - name: Argo CD (HTTP)
    type: ui
    typeLabel: NodePort
    scheme: http
    path: ":30081/"
    auth: same as Argo CD
    git: platform/argocd-access/
  - name: whoami demo
    type: ingress
    typeLabel: Ingress
    scheme: http
    host: whoami.viper.local
    auth: none
    git: platform/ingress/whoami.yaml
  - name: Headlamp (host)
    type: ingress
    typeLabel: Ingress
    scheme: http
    host: headlamp.viper.local
    auth: SA token
    git: platform/headlamp/values.yaml
  - name: Langfuse (host)
    type: ingress
    typeLabel: Ingress
    scheme: http
    host: langfuse.viper.local
    auth: first-user signup
    git: platform/langfuse/values.yaml

platform:
  - app: root
    kind: core
    kindLabel: bootstrap
    ns: argocd
    source: bootstrap/argocd/root-application.yaml
    notes: App-of-apps; watches argocd/apps
  - app: argocd-project
    kind: core
    kindLabel: core
    ns: argocd
    source: argocd/project.yaml
    notes: AppProject viper allow-list
  - app: platform-ingress
    kind: ingress
    kindLabel: ingress
    ns: kube-system / apps
    source: platform/ingress/
    notes: Traefik HelmChartConfig + whoami
  - app: platform-vault
    kind: secret
    kindLabel: secrets
    ns: vault
    source: platform/vault/values.yaml
    notes: "Vault Helm · Raft ×1 · UI :30200"
  - app: platform-external-secrets
    kind: secret
    kindLabel: secrets
    ns: external-secrets
    source: platform/external-secrets/
    notes: ESO operator
  - app: platform-headlamp
    kind: ui
    kindLabel: dashboard
    ns: headlamp
    source: platform/headlamp/values.yaml
    notes: "Headlamp · NodePort :30080"
  - app: platform-argocd-access
    kind: ui
    kindLabel: access
    ns: argocd
    source: platform/argocd-access/
    notes: "Argo UI NodePort :30443 / :30081"
  - app: platform-gateway-api
    kind: core
    kindLabel: crds
    ns: cluster
    source: platform/gateway-api/
    notes: Gateway API CRDs v1.6.0
  - app: platform-agentgateway-crds
    kind: core
    kindLabel: crds
    ns: agentgateway-system
    source: oci agentgateway-crds 1.4.1
    notes: agentgateway CRDs
  - app: platform-agentgateway
    kind: ui
    kindLabel: ai
    ns: agentgateway-system
    source: platform/agentgateway/values.yaml
    notes: control plane Helm 1.4.1
  - app: platform-agentgateway-ai
    kind: ui
    kindLabel: ai
    ns: agentgateway-system
    source: platform/agentgateway-ai/
    notes: "OpenAI + Spark routes · OTEL · :30100"
  - app: platform-langfuse-secrets
    kind: secret
    kindLabel: secrets
    ns: langfuse
    source: platform/langfuse/
    notes: ExternalSecret from Vault
  - app: platform-langfuse
    kind: ui
    kindLabel: ai
    ns: langfuse
    source: platform/langfuse/values.yaml
    notes: "Langfuse 1.5.41 + ClickHouse · :30300"

namespaces:
  - ns: argocd
    purpose: Argo CD control plane + root app-of-apps
  - ns: vault
    purpose: HashiCorp Vault server (Raft single voter)
  - ns: external-secrets
    purpose: External Secrets Operator
  - ns: headlamp
    purpose: Kubernetes dashboard UI
  - ns: agentgateway-system
    purpose: agentgateway control plane + OpenAI/Spark proxy + OTEL collector
  - ns: langfuse
    purpose: Langfuse + Postgres/Redis/ClickHouse/MinIO
  - ns: apps
    purpose: Demo / user workloads (whoami)
  - ns: kube-system
    purpose: "k3s system: Traefik, CoreDNS, metrics, local-path"
  - ns: default
    purpose: Kubernetes default (mostly unused by platform)

ingress:
  - host: whoami.viper.local
    target: whoami Service
    ns: apps
    class: traefik
  - host: headlamp.viper.local
    target: headlamp Service
    ns: headlamp
    class: traefik
  - host: langfuse.viper.local
    target: langfuse web
    ns: langfuse
    class: traefik

ports:
  - port: "80 / 443"
    service: Traefik ingress
    how: LoadBalancer on node IP (k3s ServiceLB)
  - port: "30080"
    service: Headlamp
    how: NodePort
  - port: "30443"
    service: Argo CD HTTPS
    how: "NodePort (`argocd-server-nodeport`)"
  - port: "30081"
    service: Argo CD HTTP
    how: NodePort (often redirects)
  - port: "30200"
    service: Vault UI / API
    how: "NodePort (`vault-ui`)"
  - port: "30100"
    service: agentgateway OpenAI + Spark proxy
    how: "NodePort (`agentgateway-proxy-nodeport`)"
  - port: "30300"
    service: Langfuse UI
    how: "NodePort (langfuse web service)"
  - port: "6443"
    service: Kubernetes API
    how: k3s on node (kubeconfig)

vault_paths:
  - path: secret/platform/openai
    fields: api_key
    used_by: agentgateway ExternalSecret
  - path: secret/platform/langfuse
    fields: salt, encryption_key, nextauth_secret, DB passwords
    used_by: Langfuse ExternalSecret
  - path: secret/platform/langfuse-otel
    fields: public_key, secret_key, endpoint
    used_by: OTEL collector → Langfuse

bootstrap_env:
  - name: REPO_URL
    default: this GitHub repo
    meaning: GitOps source for Argo
  - name: REPO_REVISION
    default: main
    meaning: Branch / tag / SHA
  - name: ARGOCD_VERSION
    default: v3.5.0
    meaning: Upstream install manifest pin
  - name: INSTALL_K3S_SKIP
    default: "0"
    meaning: "Set `1` if k3s already installed"

versions:
  - name: Argo CD
    pin: v3.5.0
    where: scripts/bootstrap.sh
  - name: k3s (lab observed)
    pin: v1.32.5+k3s1
    where: node install
  - name: Vault Helm chart
    pin: "0.30.0"
    where: argocd/apps/platform-vault.yaml
  - name: External Secrets chart
    pin: "0.14.4"
    where: argocd/apps/platform-external-secrets.yaml
  - name: Headlamp Helm chart
    pin: "0.44.0"
    where: argocd/apps/platform-headlamp.yaml
  - name: agentgateway / CRDs
    pin: "1.4.1"
    where: argocd/apps/platform-agentgateway*.yaml
  - name: Langfuse Helm chart
    pin: "1.5.41"
    where: argocd/apps/platform-langfuse.yaml
  - name: Gateway API CRDs
    pin: v1.6.0
    where: platform/gateway-api/
  - name: whoami image
    pin: traefik/whoami:v1.10.2
    where: platform/ingress/whoami.yaml

layout:
  - path: scripts/bootstrap.sh
    role: Only imperative install path (k3s + Argo + root)
  - path: scripts/validate.sh
    role: Local/CI checks — no cluster credentials
  - path: bootstrap/argocd/
    role: Root Application seed
  - path: argocd/project.yaml
    role: AppProject viper
  - path: argocd/apps/
    role: Child Application CRs (GitOps tree)
  - path: platform/ingress/
    role: Traefik config + whoami demo
  - path: platform/vault/
    role: Vault Helm values
  - path: platform/external-secrets/
    role: ESO Helm values + store example
  - path: platform/headlamp/
    role: Headlamp Helm values
  - path: platform/argocd-access/
    role: Argo CD UI NodePort Service
  - path: platform/gateway-api/
    role: Gateway API CRDs
  - path: platform/agentgateway/
    role: agentgateway control plane values
  - path: platform/agentgateway-ai/
    role: OpenAI + Spark Gateway, routes, OTEL
  - path: platform/langfuse/
    role: Langfuse Helm + ExternalSecret
  - path: apps/
    role: User workloads
  - path: docs/
    role: Operator runbooks
  - path: site/
    role: Hugo handbook (this site)
  - path: .github/workflows/
    role: CI validate + Pages deploy

out_of_scope:
  - item: ngrok / public tunnels
    why: Keep lab private first
  - item: Multi-node / HA control plane
    why: Single-node powerhouse focus
  - item: MetalLB
    why: k3s ServiceLB + node IP is enough
  - item: Push-based deploy from CI
    why: GitOps pull via Argo only
  - item: Cloud KMS auto-unseal
    why: Manual unseal for v1
  - item: kgateway as primary cluster Ingress
    why: Traefik is k3s default; agentgateway is AI data plane only

troubleshooting:
  - symptom: Applications stuck Unknown
    check: Repo URL / OCI chart reachable; argocd-repo-server logs
  - symptom: Project errors
    check: appproject viper sourceRepos + destinations
  - symptom: whoami 404
    check: Host header / /etc/hosts; kubectl -n apps get ingress,pods
  - symptom: Headlamp 404 / no UI
    check: "http://<node-ip>:30080/; Docker published ports"
  - symptom: Headlamp token rejected
    check: Create a fresh SA token — docs/headlamp.md
  - symptom: Argo UI unreachable
    check: svc argocd-server-nodeport; app platform-argocd-access
  - symptom: Vault sealed / UI down
    check: unseal helper; docs/vault-eso-setup.md
  - symptom: ClusterSecretStore not Ready
    check: Vault unsealed + k8s auth role external-secrets
  - symptom: agentgateway OpenAI 401/404 model
    check: Vault openai key; use gpt-5.5 or gpt-5-mini
  - symptom: Langfuse ImagePullBackOff
    check: Cluster egress/DNS to Docker Hub
  - symptom: Re-run bootstrap
    check: "Safe: skips k3s if healthy; re-applies Argo + root app"

