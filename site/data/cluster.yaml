  - key: k3s container
    value: "k3s-viper · rancher/k3s:v1.32.5-k3s1"
  - key: kubectl
    value: "docker exec k3s-viper kubectl …"
  - key: k3s InternalIP
    value: "172.17.0.2 (Docker bridge)"
  - key: k3s / API
    value: v1.32.5+k3s1
  - key: GitOps project
    value: viper
  - key: Ingress class
    value: traefik
  - key: AI Gateway
    value: "agentgateway-proxy NodePort 30100 (OpenAI + Spark + desktop)"
  - key: AI models
