uis:
  - name: Headlamp
    type: ui
    typeLabel: NodePort
    scheme: http
    path: ":30080/"
    auth: SA token
    git: platform/headlamp/
  - name: Argo CD
    type: ui
    typeLabel: NodePort
    scheme: https
    path: ":30443/"
    auth: admin + initial secret
    git: platform/argocd-access/
  - name: Vault UI
    type: ui
    typeLabel: NodePort
    scheme: http
    path: ":30200/"
    auth: root / app token after init
    git: platform/vault/values.yaml
  - name: agentgateway
    type: ui
    typeLabel: NodePort
    scheme: http
    path: ":30100/"
    auth: "OpenAI via Vault; Spark no auth; desktop lab-open; GET / → 404 expected"
    git: platform/agentgateway-ai/
  - name: Desktop viewer
    type: ui
    typeLabel: NodePort
    scheme: http
    path: ":30100/desktop/"
    auth: "lab-open noVNC — import viper-desktop:dev first"
    git: platform/desktop/
  - name: Desktop computer-use API
    type: ui
    typeLabel: NodePort
    scheme: http
    path: ":30100/desktop-api/health"
    auth: "no auth in process; gateway is the front door"
    git: platform/desktop/
  - name: Langfuse
    type: ui
    typeLabel: NodePort
    scheme: http
    path: ":30300/"
    auth: first-user signup
    git: platform/langfuse/
  - name: kagent UI
    type: ui
    typeLabel: NodePort
    scheme: http
    path: ":30500/"
    auth: "OSS kagent; dummy OpenAI key; real key on gateway"
    git: platform/kagent-ai/
  - name: Argo CD (HTTP)
    type: ui
    typeLabel: NodePort
    scheme: http
    path: ":30081/"
    auth: same as Argo CD
    git: platform/argocd-access/
  - name: whoami demo
    type: ingress
    typeLabel: Ingress
    scheme: http
    host: whoami.viper.local
    auth: none
    git: platform/ingress/whoami.yaml
  - name: Headlamp (host)
    type: ingress
    typeLabel: Ingress
    scheme: http
    host: headlamp.viper.local
    auth: SA token
    git: platform/headlamp/values.yaml
  - name: Langfuse (host)
    type: ingress
    typeLabel: Ingress
    scheme: http
    host: langfuse.viper.local
    auth: first-user signup
    git: platform/langfuse/values.yaml

