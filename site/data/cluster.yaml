    scheme: http
    port: "30080"
  - name: Argo CD
    class: argocd
    icon: "◎"
    scheme: https
    port: "30443"
  - name: Vault UI
    class: vault
    icon: "◇"
    scheme: http
    port: "30200"
  - name: agentgateway
    class: headlamp
    icon: "⚡"
    scheme: http
    port: "30100"
  - name: Langfuse
