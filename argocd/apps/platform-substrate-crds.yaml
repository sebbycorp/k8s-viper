apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-substrate-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: viper
  source:
    # Argo CD 3.5 treats the OCI parent path as the artifact (GHCR 403).
    # Full chart URL + chart: matches the working agentgateway pattern.
    repoURL: oci://ghcr.io/kagent-dev/substrate/helm/substrate-crds
    chart: substrate-crds
    targetRevision: 0.0.12
    helm:
      releaseName: substrate-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: ate-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
