# Argo CD kustomize helmCharts (platform-vault) needs --enable-helm.
# Idempotent: merge-patch argocd-cm and bounce repo-server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enable-kustomize-helm
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enable-kustomize-helm
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["argocd-cm"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["argocd-repo-server"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enable-kustomize-helm
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: enable-kustomize-helm
subjects:
  - kind: ServiceAccount
    name: enable-kustomize-helm
    namespace: argocd
---
apiVersion: batch/v1
kind: Job
metadata:
  name: enable-kustomize-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: enable-kustomize-helm
      restartPolicy: OnFailure
      containers:
        - name: patch
          image: registry.k8s.io/kubectl:v1.32.5
          command:
            - /bin/sh
            - -ec
            - |
              kubectl -n argocd patch configmap argocd-cm --type merge \
                -p '{"data":{"kustomize.buildOptions":"--enable-helm"}}'
              kubectl -n argocd rollout restart deployment/argocd-repo-server
              kubectl -n argocd rollout status deployment/argocd-repo-server --timeout=180s
