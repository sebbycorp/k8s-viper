# EXAMPLE ONLY — do not apply until Vault is initialized and Kubernetes auth is configured.
# Copy into platform/external-secrets/manifests/ and add to kustomization.yaml when ready.
# See docs/vault-eso-setup.md.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
