# kagent OSS Helm 0.10.0-rc2 — lab overlay.
# Keys are from the published chart values. Do not invent fields.
#
# Default model is routed through the existing agentgateway on :30100
# (in-cluster /v1). Secret/kagent-openai is a dummy in platform/kagent-ai;
# the gateway injects Vault secret/platform/openai. Do not put a real
# key or license JWT here.

providers:
  default: openAI
  openAI:
    provider: OpenAI
    model: gpt-5.5
    apiKeySecretRef: kagent-openai
    apiKeySecretKey: OPENAI_API_KEY
    # Dummy Secret/kagent-openai is in platform/kagent-ai (not a real key).
    # Do not set apiKey here — that would make Helm own the same Secret.
    config:
      baseUrl: "http://agentgateway-proxy.agentgateway-system.svc.cluster.local/v1"

controller:
  substrate:
    enabled: true
    ateApiEndpoint: dns:///api.ate-system.svc:443
    ateApiInsecure: true
    atenetRouterURL: http://atenet-router.ate-system.svc:80
    ateApiTokenFile: /var/run/secrets/tokens/ate-api/token
    defaultWorkerPool:
      namespace: kagent
      name: kagent-default

# Do not set substrate.enabled (that would double-install the bundled
# substrate 0.0.9 subchart). Substrate 0.0.9 is a separate Argo app in
# ate-system so it matches the official kagent 0.10.0-rc2 pairing.

substrateWorkerPool:
  create: true
  name: kagent-default
  replicas: 1
  ateomImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.0.9
  sandboxClass: gvisor

# UI stays ClusterIP. Chart ui-service template has no nodePort field.
# NodePort 30500 is platform/kagent-ai/ui-nodeport.yaml.

kmcp:
  enabled: true

grafana-mcp:
  enabled: false

# Default Helm Agent subcharts. Chart 0.10.0-rc2 values + Chart.yaml
# conditions are TOP-LEVEL `<name>.enabled` (not agents.*). Defaults true.
# After merge, platform-kagent must not emit these Agent CRs. The only
# lab agent is SandboxAgent/hello-substrate in platform-kagent-ai.
# querydoc is a tool Deployment — leave the chart default (enabled).
k8s-agent:
  enabled: false
kgateway-agent:
  enabled: false
istio-agent:
  enabled: false
promql-agent:
  enabled: false
observability-agent:
  enabled: false
argo-rollouts-agent:
  enabled: false
helm-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-debug-agent:
  enabled: false
