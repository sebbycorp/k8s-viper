# SSA field patch only. Substrate chart 0.0.12 emits SandboxConfig/gvisor-default
# without spec.pauseImage; the CRD requires it. Do not list other spec fields
# here — Helm owns those (sandboxClass, assets). Same pattern as
# platform/argocd-access/argocd-cm-kustomize.yaml.
#
# Digest is the GKE pause image documented on controller.substrate.pauseImage
# in the kagent 0.10.0-rc2 chart values.
apiVersion: ate.dev/v1alpha1
kind: SandboxConfig
metadata:
  name: gvisor-default
spec:
  pauseImage: gcr.io/gke-release/pause@sha256:bcbd57ba5653580ec647b16d8163cdd1112df3609129b01f912a8032e48265da
