# Agent Substrate Helm 0.0.12 — lab overlay for dockerized k3s.
# Chart defaults are kept unless noted. Do not invent keys.
#
# Chart 0.0.12 has no values key for extra ate-api-server ClusterRole rules
# or SandboxConfig.pauseImage. Those live in this directory and are applied
# by platform-substrate-rbac (wave 2, Server-Side Apply):
#   - ate-api-server-extra-rbac.yaml (storageclasses + csidriverconfigs)
#   - sandboxconfig-pauseimage.yaml (SSA field only; do not Replace the CR)
#
# JWT auth (chart default) is required for kagent's JWT-to-ateapi path.
# Do not set auth.mode=mtls (needs feature gates this k3s lab does not enable)
# and do not disable auth.jwt.bootstrap.
#
# Valkey stays at 6 replicas. The cluster-init Job hardcodes pods 0-5, so
# setting valkey.replicas below 6 hangs initialization.

valkey:
  enabled: true
  replicas: 6
