# Chart 0.0.12 ate-api-server ClusterRole grants pods + ate.dev
# {actortemplates,workerpools,sandboxconfigs} only. The live process also
# lists cluster-scoped storageclasses and csidriverconfigs; without these
# verbs the Deployment crash-loops and never becomes Ready.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ate-api-server-extra
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ate.dev"]
    resources: ["csidriverconfigs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ate-api-server-extra
subjects:
  - kind: ServiceAccount
    name: ate-api-server
    namespace: ate-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ate-api-server-extra
