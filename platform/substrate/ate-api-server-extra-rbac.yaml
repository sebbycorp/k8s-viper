# Chart 0.0.9 ate-api-server ClusterRole already grants pods + ate.dev
# {actortemplates,workerpools,sandboxconfigs}. Verified against substrate
# v0.0.9 cmd/ateapi/main.go: the process lists those three CRs plus worker
# and atelet pods. It does not start StorageClass or CSIDriverConfig
# informers (those landed in 0.0.12 with the csidriverconfigs CRD).
#
# Extra verbs for storageclasses / csidriverconfigs are therefore not
# required on 0.0.9 and must not be granted "just in case" — listing
# csidriverconfigs.ate.dev would be a grant for a CRD this pin does not
# install. This ClusterRole stays as the GitOps hook for future chart
# gaps (platform-substrate-rbac). Empty rules are intentional.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ate-api-server-extra
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ate-api-server-extra
subjects:
  - kind: ServiceAccount
    name: ate-api-server
    namespace: ate-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ate-api-server-extra
