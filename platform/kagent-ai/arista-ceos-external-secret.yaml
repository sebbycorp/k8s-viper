# Vault secret/platform/arista-ceos → Secret/arista-ceos-mcp.
# Keys in Vault: username, password, and hosts_json (preferred) or hosts.
# Never commit the password or a filled-in hosts document with credentials.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: arista-ceos-mcp
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: arista-ceos-mcp
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        ARISTA_USERNAME: "{{ .username }}"
        ARISTA_PASSWORD: "{{ .password }}"
        ARISTA_HOSTS_JSON: "{{ if .hosts_json }}{{ .hosts_json }}{{ else }}{{ .hosts }}{{ end }}"
  dataFrom:
    - extract:
        key: platform/arista-ceos
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
