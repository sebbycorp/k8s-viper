# Vault secret/platform/fortigate → Secret/fortigate-mcp.
# Keys in Vault: token, host. Never commit the REST API token.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fortigate-mcp
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: fortigate-mcp
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: FORTIGATE_TOKEN
      remoteRef:
        key: platform/fortigate
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: FORTIGATE_HOST
      remoteRef:
        key: platform/fortigate
        property: host
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
