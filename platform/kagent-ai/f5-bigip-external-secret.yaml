# Vault secret/platform/f5-bigip → Secret/f5-bigip-mcp.
# Keys in Vault: host, username, password. Never commit the password.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: f5-bigip-mcp
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: f5-bigip-mcp
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: F5_HOST
      remoteRef:
        key: platform/f5-bigip
        property: host
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: F5_USERNAME
      remoteRef:
        key: platform/f5-bigip
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: F5_PASSWORD
      remoteRef:
        key: platform/f5-bigip
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
