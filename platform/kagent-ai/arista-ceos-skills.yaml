# Skill markdown included into SandboxAgent.spec.declarative.systemMessage
# via promptTemplate (kagent 0.10.0-rc2). spec.skills is rejected on
# SandboxAgent. Do not put secrets here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: arista-ceos-skills
  namespace: kagent
data:
  inventory.md: |
    # Skill: inventory and health

    Help the operator see which cEOS nodes are reachable.

    ## Do this

    1. Call `arista_health` for a concise fleet view (version, BGP, interfaces).
    2. Call `arista_inventory` when hostname / model / EOS version / uptime
       is the question.
    3. Name the tool you used. If a node errors, keep that error.

    ## Do not

    - Invent a hostname, model, EOS version, or uptime.
    - Treat a failed node as up. Live verification of the lab is pending
      until Containerlab is reachable from Viper.
    - Print ARISTA_PASSWORD, Basic auth headers, or Vault tokens.

  bgp.md: |
    # Skill: BGP

    Explain eBGP sessions on this isolated demo. Expected ASNs (confirm
    with tools, do not assume they are established): spine1 65000,
    leaf1 65101, leaf2 65102.

    ## Do this

    1. Call `arista_bgp_summary` with no node for all allowlisted boxes,
       or with `spine1` / `leaf1` / `leaf2` for one box.
    2. Quote peer address, remote ASN, and state from the tool.
    3. Explain Established vs Idle/Active in operator language.

    ## Do not

    - Invent a neighbor, ASN, or prefix count.
    - Claim a session is up when the tool said otherwise.
    - Configure BGP. This server is read-only.

  topology.md: |
    # Skill: interfaces, LLDP, routes

    Map the fabric and the IPv4 table.

    ## Do this

    1. `arista_interfaces` on one node for link state and addresses.
    2. `arista_lldp_neighbors` on one node or all nodes for the wiring.
    3. `arista_routes` on one node; pass an IPv4 prefix only when the
       operator asked to filter.
    4. Explain next-hops and LLDP neighbors from the tool output.

    ## Do not

    - Accept a URL or arbitrary host as `node`. Only spine1, leaf1, leaf2.
    - Invent a route or LLDP neighbor.
    - Run config, clear, or write commands. There is no generic CLI tool.
