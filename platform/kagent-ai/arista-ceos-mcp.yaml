# Arista EOS eAPI MCP tools Deployment + Service + RemoteMCPServer.
# Image: arista-ceos-mcp:dev (local tag for `ctr images import` on the k3s node).
# imagePullPolicy: IfNotPresent — import on Viper before the pod can start.
#
# RemoteMCPServer fields match kagent-crds 0.10.0-rc2 and live
# RemoteMCPServer/kagent-tool-server (STREAMABLE_HTTP :8084 /mcp).
# Do not invent spec fields. Do not set spec.tls on an http:// URL.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arista-ceos-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/name: arista-ceos-mcp
    app.kubernetes.io/part-of: k8s-viper
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arista-ceos-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arista-ceos-mcp
        app.kubernetes.io/part-of: k8s-viper
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: arista-ceos-mcp
          image: arista-ceos-mcp:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: mcp
              containerPort: 8084
              protocol: TCP
          env:
            - name: ARISTA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: arista-ceos-mcp
                  key: ARISTA_USERNAME
            - name: ARISTA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arista-ceos-mcp
                  key: ARISTA_PASSWORD
            - name: ARISTA_HOSTS_JSON
              valueFrom:
                secretKeyRef:
                  name: arista-ceos-mcp
                  key: ARISTA_HOSTS_JSON
            - name: ARISTA_ALLOWED_NODES
              value: "spine1,leaf1,leaf2"
            - name: ARISTA_VERIFY_TLS
              value: "false"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8084"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: arista-ceos-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/name: arista-ceos-mcp
    app.kubernetes.io/part-of: k8s-viper
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arista-ceos-mcp
  ports:
    - name: mcp
      port: 8084
      targetPort: mcp
      protocol: TCP
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: arista-ceos-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/name: arista-ceos-mcp
    app.kubernetes.io/part-of: k8s-viper
spec:
  description: Read-only Arista EOS eAPI tools for the cEOS Containerlab demo
  protocol: STREAMABLE_HTTP
  timeout: 30s
  sseReadTimeout: 5m0s
  url: http://arista-ceos-mcp.kagent:8084/mcp
