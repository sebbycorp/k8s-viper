# MCP multiplex path on the existing agentgateway-proxy Gateway.
# Clients call Streamable HTTP:
#   http://172.16.10.135:30100/mcp
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: viper-mcp
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/name: viper-mcp
    app.kubernetes.io/part-of: k8s-viper
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: viper-mcp
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
          weight: 1
