# DGX Spark path prefix on the existing agentgateway-proxy Gateway.
# Clients call:
#   POST /spark/v1/chat/completions  { "model": "unsloth/Qwen3.8-27B-NVFP4", ... }
# Host/model from k8s-goose config/routes/dgx-spark-llm-route.yaml (same Gateway as OpenAI here).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dgx-spark-llm
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /spark
      backendRefs:
        - name: dgx-spark-llm
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
          weight: 1
