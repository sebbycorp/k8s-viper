# Syncs Vault secret/platform/openai → K8s Secret openai-secret (Authorization header value).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openai-secret
  namespace: agentgateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openai-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # agentgateway OpenAI auth expects Authorization secret key (Bearer prefix)
        Authorization: "Bearer {{ .api_key }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: platform/openai
        property: api_key
